name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building Web Application..."
          test -f index.html
          echo "Build Successful!"

      - name: Test
        run: |
          echo "Running tests..."
          grep -q "Hello DevOps" index.html
          echo "Tests Passed!"

      - name: Generate Logs
        run: |
          echo "CI Pipeline completed"
          date

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"✅ CI/CD Build Successful - devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"❌ CI/CD Build Failed - devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
